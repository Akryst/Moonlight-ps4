# moonlight-ps4
# Edit host / debug_host on-console (Settings menu) or here after install.
# cfg_rev: config schema revision. Files with rev < 2 get the rev-2 decode
# defaults (dec_pipeline_depth = 2, dec_au_onion = true) re-applied on load.
cfg_rev = 2
host =
app = Desktop
debug_host =
width = 1920
height = 1080
fps = 60
bitrate = 20000
sops = true
local_audio = false
prefer_hw = true
videodec2_spike = false
prefer_ycbcr = false
enable_file_log = false
show_stats = false

# NV12 -> BGRA conversion (only used when prefer_ycbcr = false).
# bgra_workers: convert threads, 1..6.
# bgra_nt: -1 picks by framebuffer mapping (cached stores on the ONION/WB
#          alias, streaming stores on WC_GARLIC). 0 forces cached, 1 streaming.
bgra_workers = 4
bgra_nt = -1

# Videodec2 (hardware decode) tuning. Decode overlaps the BGRA convert of the
# previous frame, so the frame budget is ~max(decode, convert), not the sum.
# dec_pipeline_depth: frames in flight inside Videodec2 (1..3). 2 (default)
#   pipelines the decoder: Decode() submits and returns the previous frame,
#   so the CPU parse of frame N overlaps the HW decode of N-1 and the call
#   itself is a few ms. Costs +1 frame (~16 ms) of latency; set 1 for the
#   synchronous lowest-latency mode (decode = parse + HW, ~6-18 ms at 1080p).
# dec_thread_prio: Orbis priority of the Vdec CPU worker (lower = higher
#   priority). Try 500-600 if decode time spikes while the convert runs.
# dec_au_onion: AU bitstream buffer in cacheable ONION (default). false =
#   WC_GARLIC: the Vdec worker then parses over uncached reads and decode
#   time grows ~0.2-0.3 ms per KB of frame (16-18 ms at 30 Mbps).
# slices_per_frame: CAPABILITY_SLICES_PER_FRAME asked of the host.
dec_pipeline_depth = 2
dec_thread_prio = 700
dec_au_onion = true
dec_fb_garlic = false
slices_per_frame = 2
